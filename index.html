<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background-color: #ffeead;
        margin: 10px;
      }

      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /*width*/
        grid-template-rows: 100px 300px 100px; /*height*/
        grid-template-areas:
          "header header header"
          "main main aside"
          "footer footer footer";
        grid-gap: 3px;
      }

      /*Style grid*/
      .container > div {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2em;

        &:nth-child(1n) {
          background-color: #96ceb4;
        }

        &:nth-child(2n) {
          background-color: #ff6f69;
        }

        &.header {
          /* grid-column: 1 / 3; */
          grid-area: header;
        }

        &.main {
          /* grid-column-start: 1;
          grid-column-end: 3; */
          grid-area: main;
        }

        &.aside {
          /* grid-column: 3 / -1;
          grid-row: 1 / -1; */
          grid-area: aside;
        }

        &.footer {
          /* grid-column: 1 / 3; */
          grid-area: footer;
        }
      }

      /* MEDIA QUERIES */
      @media (max-width: 768px) {
        .container {
          grid-template-areas:
            "header header"
            "main aside"
            "footer footer";
          grid-template-columns: 2fr 1fr;
          grid-template-rows: 80px 200px 80px;
        }
      }

      @media (max-width: 480px) {
        .container {
          grid-template-areas:
            "header "
            "aside"
            "main"
            "footer";
          grid-template-columns: 1fr;
          grid-template-rows: 60px 150px 200px 60px;
        }
      }

      body::before {
        content: "DESKTOP (>768px)";
        display: block;
        text-align: center;
        padding: 10px;
        background-color: #88d8b0;
        color: white;
        font-weight: bold;
        margin-bottom: 10px;
        border-radius: 5px;
      }

      @media (max-width: 768px) {
        body::before {
          content: "TABLET (≤768px)";
          background-color: #ffcc5c;
        }
      }

      @media (max-width: 480px) {
        body::before {
          content: "MOBILE (≤480px)";
          background-color: #ff6f69;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">HEADER</div>
      <div class="main">MAIN</div>
      <div class="aside">ASIDE</div>
      <div class="footer">FOOTER</div>
    </div>
  </body>
</html>
